name: deploy-docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: docs
          bundler-cache: true

      - name: Build Jekyll site
        working-directory: docs
        run: bundle exec jekyll build

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.CSE125_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          cat > ~/.ssh/known_hosts <<'EOF'
          [cse125.ucsd.edu]:222 ssh-rsa 
          [cse125.ucsd.edu]:222 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBBMbACmS5/2ZqE7fHppRE/00RlEFoLHz5DmJ1hIbc3wKF5B74OuSoIC+Mvlyz2AOF2Z364wQbrZHKsdANiQanM8=
          [cse125.ucsd.edu]:222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILTXKYBOS1sJKwPetUdOeK5alD3gB3MtIXXOtwnAJkPL
          EOF
          chmod 600 ~/.ssh/known_hosts

      - name: Upload site
        working-directory: docs
        run: |
          scp -P 222 -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
            -r _site/* jaroot@cse125.ucsd.edu:/var/www/html/cse125/2026/cse125g5/
