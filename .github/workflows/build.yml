name: build

on:
  push:
    branches: [main]
  pull_request:

env:
  SCCACHE_GHA_ENABLED: "true"
  CMAKE_C_COMPILER_LAUNCHER: sccache
  CMAKE_CXX_COMPILER_LAUNCHER: sccache

jobs:
  linux-gcc-nix:
    name: linux-gcc (nix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build
        run: nix develop .#ci -c bash ./build-linux-gcc.sh -DCMAKE_BUILD_TYPE=Release

      - name: ctest
        working-directory: build-linux-gcc
        run: nix develop .#ci -c ctest --output-on-failure

      - name: Server smoke test
        run: |
          nix develop .#ci -c bash -c '
            set +e
            timeout 3s ./build-linux-gcc/server
            code=$?
            if [ "$code" != "124" ]; then
              echo "server exited with $code (expected 124 from timeout)"
              exit 1
            fi
          '

      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: |
            build-linux-gcc/client
            build-linux-gcc/server
            build-linux-gcc/shaders/
          if-no-files-found: error
          retention-days: 1

  windows-cross-nix:
    name: windows-mingw-cross (nix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build
        run: nix develop .#ci -c bash ./build-windows.sh -DCMAKE_BUILD_TYPE=Release

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64-mingw
          path: |
            build-windows/client.exe
            build-windows/server.exe
            build-windows/shaders/
          if-no-files-found: error
          retention-days: 1

  linux-clang-tidy:
    name: linux-clang + clang-tidy (nix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build
        run: nix develop .#ci -c bash ./build.sh

      - name: ctest
        working-directory: build
        run: nix develop .#ci -c ctest --output-on-failure

      - name: Server smoke test
        run: |
          nix develop .#ci -c bash -c '
            set +e
            timeout 3s ./build/server
            code=$?
            if [ "$code" != "124" ]; then
              echo "server exited with $code (expected 124 from timeout)"
              exit 1
            fi
          '

      - name: clang-tidy check
        run: |
          nix develop .#ci -c bash -c '
            find src -name "*.cpp" | xargs clang-tidy --fix -p build \
              --header-filter=".*" --exclude-header-filter="(lib|build)/.*"
          '
          git diff --exit-code -- src/

  linux-native:
    name: linux (apt, no nix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build pkg-config \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libx11-dev libxcursor-dev libxi-dev libxinerama-dev \
            libxrandr-dev libxrender-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            python3-jinja2 \
            libasound2-dev \
            libpulse-dev \
            libjack-jackd2-dev

      - uses: lukka/get-cmake@latest

      - name: Build
        run: bash ./build.sh

      - name: ctest
        working-directory: build
        run: ctest --output-on-failure

      - name: Server smoke test
        run: |
          set +e
          timeout 3s ./build/server
          code=$?
          if [ "$code" != "124" ]; then
            echo "server exited with $code (expected 124 from timeout)"
            exit 1
          fi

  macos-native:
    name: macOS (brew, no nix)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install jinja2
        run: python -m pip install jinja2

      - name: Build
        run: bash ./build.sh "-DPython_EXECUTABLE=$pythonLocation/bin/python" -DCMAKE_BUILD_TYPE=Release

      - name: ctest
        working-directory: build
        run: ctest --output-on-failure

      - name: Server smoke test
        run: |
          set +e
          ./build/server &
          pid=$!
          sleep 3
          if ! kill -0 "$pid" 2>/dev/null; then
            wait "$pid"
            echo "server exited early with $?"
            exit 1
          fi
          kill "$pid" 2>/dev/null
          wait "$pid" 2>/dev/null
          exit 0

      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: |
            build/client
            build/server
            build/shaders/
          if-no-files-found: error
          retention-days: 1

  windows-native:
    name: Windows (MSVC)
    runs-on: windows-latest
    env:
      # sccache + MSVC + assimp forces /Zi + /Fd which sccache can't cache.
      # Disable launchers for this job only; other jobs keep sccache.
      CMAKE_C_COMPILER_LAUNCHER: ""
      CMAKE_CXX_COMPILER_LAUNCHER: ""
      SCCACHE_GHA_ENABLED: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: lukka/get-cmake@latest

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install jinja2
        run: python -m pip install jinja2

      - name: Build
        shell: cmd
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPython_EXECUTABLE="%pythonLocation%\python.exe" -DCMAKE_C_COMPILER_LAUNCHER= -DCMAKE_CXX_COMPILER_LAUNCHER=
          cmake --build build

      - name: ctest
        working-directory: build
        run: ctest --output-on-failure -C Release

      - name: Server smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "build\server.exe" -PassThru -NoNewWindow
          Start-Sleep -Seconds 3
          if ($p.HasExited) {
            Write-Error "server exited early with code $($p.ExitCode)"
            exit 1
          }
          Stop-Process -Id $p.Id

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64-msvc
          path: |
            build/client.exe
            build/server.exe
            build/shaders/
          if-no-files-found: error
          retention-days: 1

  release-publish:
    name: release (publish to cse125)
    needs: [linux-gcc-nix, windows-cross-nix, macos-native, windows-native]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Package per-platform release zips
        run: |
          set -euo pipefail
          SHA="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y%m%d)"
          mkdir -p out stage
          # Bundle binaries + shaders + the matching fetch-assets script (no
          # assets — players run fetch-assets to pull the full bundle from cse125).
          package() {
            platform="$1"; artifact="$2"; fetch="$3"
            name="cse125g5-${platform}-${DATE}-${SHA}"
            dest="stage/${name}"
            mkdir -p "$dest"
            cp -r "artifacts/${artifact}/." "$dest/"
            cp "scripts/dist/${fetch}" "$dest/"
            {
              echo "platform: ${platform}"
              echo "git: $(git rev-parse HEAD)"
              echo "branch: ${GITHUB_REF_NAME}"
              echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "run: ${GITHUB_RUN_ID}"
            } > "$dest/BUILD_INFO.txt"
            (cd stage && zip -qr "../out/${name}.zip" "${name}")
            echo "packaged out/${name}.zip"
          }
          package linux         linux-x64         fetch-assets.sh
          package windows-mingw windows-x64-mingw fetch-assets.bat
          package windows-msvc  windows-x64-msvc  fetch-assets.bat
          package macos         macos-arm64       fetch-assets.sh
          ls -lh out/

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.CSE125_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          cat > ~/.ssh/known_hosts <<'EOF'
          [cse125.ucsd.edu]:222 ssh-rsa 
          [cse125.ucsd.edu]:222 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBBMbACmS5/2ZqE7fHppRE/00RlEFoLHz5DmJ1hIbc3wKF5B74OuSoIC+Mvlyz2AOF2Z364wQbrZHKsdANiQanM8=
          [cse125.ucsd.edu]:222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILTXKYBOS1sJKwPetUdOeK5alD3gB3MtIXXOtwnAJkPL
          EOF
          chmod 600 ~/.ssh/known_hosts

      - name: Upload to cse125 builds/release
        run: |
          set -euo pipefail
          REMOTE_DIR=/var/www/html/cse125/2026/cse125g5/builds/release
          ssh -p 222 -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
            jaroot@cse125.ucsd.edu "mkdir -p '$REMOTE_DIR'"
          scp -P 222 -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
            out/*.zip jaroot@cse125.ucsd.edu:"$REMOTE_DIR"/
